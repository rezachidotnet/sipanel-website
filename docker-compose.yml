name: sipanel-staging

services:
  nextjs:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: 1
      PORT: 3000
      HOSTNAME: 0.0.0.0
      RFQ_UPLOAD_DIR: /app/private/rfq-uploads/tmp
      RFQ_SUBMISSION_DIR: /app/private/rfq-submissions
      RFQ_NOTIFICATION_WEBHOOK_URL: ${RFQ_NOTIFICATION_WEBHOOK_URL:-}
      RFQ_NOTIFICATION_WEBHOOK_TOKEN: ${RFQ_NOTIFICATION_WEBHOOK_TOKEN:-}
      RFQ_NOTIFICATION_TO_EMAIL: ${RFQ_NOTIFICATION_TO_EMAIL:-}
      RFQ_NOTIFICATION_FROM_EMAIL: ${RFQ_NOTIFICATION_FROM_EMAIL:-}
      RFQ_NOTIFICATION_SUBJECT: ${RFQ_NOTIFICATION_SUBJECT:-New SIPANEL RFQ submission}
      ODOO_URL: http://odoo:8069
      ODOO_DB: ${ODOO_DB}
      ODOO_USERNAME: ${ODOO_USERNAME}
      ODOO_PASSWORD: ${ODOO_PASSWORD}
      ODOO_CRM_TEAM_ID: ${ODOO_CRM_TEAM_ID:-}
      ODOO_CRM_SOURCE_ID: ${ODOO_CRM_SOURCE_ID:-}
      NEXT_PUBLIC_GA4_MEASUREMENT_ID: ${NEXT_PUBLIC_GA4_MEASUREMENT_ID:-}
      NEXT_PUBLIC_GTM_ID: ${NEXT_PUBLIC_GTM_ID:-}
    volumes:
      - rfq_uploads:/app/private/rfq-uploads
      - rfq_submissions:/app/private/rfq-submissions
    depends_on:
      odoo:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/en >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - sipanel_internal

  odoo:
    image: odoo:17.0
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - odoo
      - --config=/etc/odoo/odoo.conf
      - --proxy-mode
      - --admin-passwd=${ODOO_MASTER_PASSWORD}
    environment:
      HOST: postgres
      USER: ${POSTGRES_USER}
      PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - odoo_data:/var/lib/odoo
      - ./odoo/odoo.conf:/etc/odoo/odoo.conf:ro
      - ./odoo/addons:/mnt/extra-addons
    expose:
      - "8069"
      - "8072"
    healthcheck:
      test: ["CMD-SHELL", "python3 - <<'PY'\nimport urllib.request\nurllib.request.urlopen('http://127.0.0.1:8069/web/login', timeout=5)\nPY"]
      interval: 30s
      timeout: 10s
      retries: 8
      start_period: 90s
    networks:
      - sipanel_internal

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB:-postgres}\""]
      interval: 30s
      timeout: 5s
      retries: 5
    networks:
      - sipanel_internal

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      nextjs:
        condition: service_healthy
      odoo:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./nginx/www:/var/www/certbot
    healthcheck:
      test: ["CMD-SHELL", "nginx -t"]
      interval: 30s
      timeout: 5s
      retries: 5
    networks:
      - sipanel_internal

volumes:
  postgres_data:
  odoo_data:
  rfq_uploads:
  rfq_submissions:

networks:
  sipanel_internal:
    driver: bridge
